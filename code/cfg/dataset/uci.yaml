#-------------------------------------- dataset -----------------------------------------#
# specify that the dataset used is the UCI dataset
dataset: uci
# the number of features of each sample in the dataset is 9
n_feature: 9
# presumably len_sw is the length of the sliding window, i.e. the sequence length of each sample is 128
len_sw: 128
# the number of classes in the dataset is 6
n_class: 6

# the id of the target domain is 1; in the domain adaptation problem this makes the target domain explicit
target_domain: 1
# the total number of domains in the dataset is 4
n_domains: 4
# the number of target domains is 1
n_target_domains: 1

#------------------------------------ training -------------------------------------------#
# the number of samples per batch during training is 180
batch_size: 64
# set the random seed to 10 to ensure the reproducibility of the experiments
seed: 10
# validate once every 25 training batches
interval_validate: 25
# the output path of the training log is the logs folder under the current directory
out_path: './logs'
# indicates that the model is saved during training
save_model: True

#-------------------------------------- model -------------------------------------------#
# specify that the model used is a convolutional neural network (CNN)
model: 'cnn'
# presumably res indicates whether to use a residual structure; here it is set to False, i.e. no residual structure
res: false
# the path for loading the model weights when resuming training is the ckpt folder under the current directory
resume: './ckpt'

