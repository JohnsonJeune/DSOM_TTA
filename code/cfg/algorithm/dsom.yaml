#---------------------------------- adaptation -------------------------------------------#
return_feature: True
adaption: 'dsom'

positive:
  enabled: True
  shot_capacity: 25   # reduce the capacity to avoid redundant features
  alpha: 5.0
  beta: 9.0           # tune the feature matching sensitivity

negative:
  enabled: False

AFFINITY: 'kNN'           # options: 'rbf', 'kNN', 'linear'
SIGMA: 1.0                # RBF kernel bandwidth (only effective for rbf_affinity)
KNN: 10                   # k-nearest-neighbor parameter (used by both rbf and kNN)
FORCE_SYMMETRY: false     # whether to force the affinity matrix to be symmetric

thresh: 0.5
